[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavenmagnet"
version = "0.1.0"
description = "Production-quality local NLP classification pipeline for MavenMagnet Data Scientist assignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MavenMagnet Data Science Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
]

